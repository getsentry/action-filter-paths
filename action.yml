name: Filter paths
description: Securely match changed repository paths against named filters
author: Sentry
inputs:
  filters:
    description: YAML mapping of output names to one or more glob patterns
    required: true
outputs:
  changes:
    description: JSON array containing the names of filters that matched
runs:
  using: node24
  main: dist/index.js
branding:
  icon: filter
  color: purple
